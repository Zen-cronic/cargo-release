schema: cargo-release-service-inventory/v1
region: us-central1
truth_policy:
  FIXTURE: local deterministic evidence or synthetic partner authority
  ADAPTER: deployable code or configuration exists but no managed receipt is present
  NATIVE: the request retained a Google-managed resource, event, operation, or trace ID
services:
  cargo-release-controller:
    runtime: cloud-run
    source: Dockerfile
    identity: cargo-controller
    ingress: internal-and-cloud-load-balancing
    truth_gate: K_SERVICE + GOOGLE_CLOUD_PROJECT + CloudEvent headers + cloud trace context
  cargo-release-web:
    runtime: cloud-run
    source: web/Dockerfile
    identity: cargo-web
    ingress: public-demo
    relay_authorization:
      default: deny
      operator_actor_source: server environment only
      public_reads:
        - GET /v1/missions/{mission_id}
        - GET /v1/missions/{mission_id}/activity
        - GET /v1/missions/{mission_id}/model-receipts
      bounded_commands:
        - POST /v1/missions/demo
        - POST /v1/missions/{mission_id}/start
        - POST /v1/missions/{mission_id}/owner-bond
        - POST /v1/missions/{mission_id}/replay
      forbidden: query forwarding, traversal, arbitrary bodies, client actor override, privileged controller routes
  cargo-release-coordinator:
    runtime: agent-runtime
    source: src/cargo_release/adk_agent.py
    deployer: scripts/deploy_agent_runtime.py
    identity_type: AGENT_IDENTITY
    model: gemini-3.5-flash
    model_inference_location: global
    governance_location: us-central1
    registry: automatic after Agent Runtime deployment
    root_tool:
      name: start_bounded_mission
      calls_per_turn: 1
      mutation_scope: one lease-protected controller POST after read-only preflight
    delegation:
      transfer_policy: root-to-worker only; peer transfer denied
      worker_mode: single_turn
      raw_content_access: none
      tool_error_policy: return DEGRADED; no retry in the same turn
      workers:
        - name: manifest_evidence_worker
          tool: inspect_evidence_scope
          scope: verified status, fact keys, and digests only
        - name: security_pack_worker
          tool: inspect_security_scope
          scope: human, insurer, and adjuster references only
        - name: carrier_authority_worker
          tool: inspect_authority_scope
          scope: acceptance, order, and read-back receipts only
        - name: runtime_recovery_worker
          tool: assess_runtime_recovery
          scope: durable run classification without lease acquisition
    invariant: every model and worker returns release_authority=false
  insurer-fixture:
    runtime: cloud-run
    app: cargo_release.partners:insurer_app
    identity: cargo-insurer
    data_truth: FIXTURE
  adjuster-fixture:
    runtime: cloud-run
    app: cargo_release.partners:adjuster_app
    identity: cargo-adjuster
    data_truth: FIXTURE
  carrier-fixture:
    runtime: cloud-run
    app: cargo_release.partners:carrier_app
    identity: cargo-carrier
    data_truth: FIXTURE
managed_surfaces:
  eventarc:
    role: authenticated casualty trigger
    current_local_mode: FIXTURE
  agent_runtime:
    role: ADK coordinator execution
    current_local_mode: ADAPTER
  memory_bank:
    role: reviewed cross-session release context; never authoritative state
    env: CARGO_RELEASE_MEMORY_BANK
    current_local_mode: ADAPTER
  agent_registry:
    role: coordinator automatic registration plus partner REST discovery
    current_local_mode: ADAPTER
  agent_gateway:
    role: fail-closed identity-aware authorization with an exact Agent Registry allowlist
    current_local_mode: ADAPTER
  model_armor:
    role: inline ingress/egress prompt-injection and sensitive-data screening
    current_local_mode: ADAPTER
  agent_observability:
    role: OpenTelemetry topology, metrics, logs, and traces
    current_local_mode: ADAPTER
state_authority:
  owner: deterministic controller
  database: cloud-sql-postgresql
  managed_requirement: CARGO_RELEASE_DB_HOST must resolve to the Cloud SQL Unix socket
  local_fixture: SQLite is permitted only outside managed Cloud Run
  rule: model output and Memory Bank cannot mutate release state
  release_prerequisites:
    - adjuster acceptance receipt
    - carrier release-order receipt
    - carrier read-back receipt
