<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Cargo Release authority architecture</title>
  <desc id="desc">A light, four-stage architecture diagram. Authenticated event and multimodal evidence enter a scoped Gemini and ADK fleet. A deterministic Cloud Run controller and Cloud SQL require one human attestation plus independently signed partner receipts before physical cargo release. Hostile text is quarantined and an adjuster rejection creates a corrected revision.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#203354" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#326BDB"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C47A12"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#17815D"/>
    </marker>
    <marker id="arrowCoral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C94D57"/>
    </marker>
    <style>
      .display { font-family: "Archivo", "Arial Narrow", sans-serif; font-weight: 740; }
      .body { font-family: "Manrope", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .ink { fill: #17243A; }
      .muted { fill: #627087; }
      .blue { fill: #326BDB; }
      .amber { fill: #A8620B; }
      .green { fill: #17815D; }
      .coral { fill: #B43E49; }
      .lane { fill: #FFFFFF; stroke: #D7DFEA; stroke-width: 1.5; }
      .node { fill: #FFFFFF; stroke: #D7DFEA; stroke-width: 1.5; }
      .nodeBlue { fill: #F1F6FF; stroke: #8EAFE9; stroke-width: 1.5; }
      .nodeAmber { fill: #FFF8E9; stroke: #E4B96D; stroke-width: 1.5; }
      .nodeGreen { fill: #EEF9F5; stroke: #8CCBB7; stroke-width: 1.5; }
      .nodeCoral { fill: #FFF2F3; stroke: #E4A2A7; stroke-width: 1.5; }
      .readEdge { fill: none; stroke: #326BDB; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrowBlue); }
      .advanceEdge { fill: none; stroke: #C47A12; stroke-width: 3.2; marker-end: url(#arrowAmber); }
      .authorityEdge { fill: none; stroke: #17815D; stroke-width: 3.4; marker-end: url(#arrowGreen); }
      .exceptionEdge { fill: none; stroke: #C94D57; stroke-width: 2.5; stroke-dasharray: 7 7; marker-end: url(#arrowCoral); }
      .iconStroke { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#F7F9FC"/>
  <circle cx="1640" cy="-20" r="360" fill="#EAF1FF"/>
  <circle cx="90" cy="1120" r="260" fill="#EDF8F4"/>

  <!-- Header -->
  <g transform="translate(70 58)">
    <rect width="52" height="52" rx="12" fill="#326BDB"/>
    <path d="M14 18h24v18H14zM20 13v28M32 13v28" fill="none" stroke="#fff" stroke-width="2.4"/>
    <text x="72" y="24" class="display ink" font-size="31">Cargo Release</text>
    <text x="72" y="49" class="mono blue" font-size="12" letter-spacing="2">GOOGLE CLOUD AUTHORITY ARCHITECTURE</text>
  </g>
  <g transform="translate(880 56)">
    <text x="850" y="24" text-anchor="end" class="display ink" font-size="25">Agents coordinate. They never hold the key.</text>
    <text x="850" y="53" text-anchor="end" class="body muted" font-size="15">A visual fact may change the plan. Only verified identities may change release state.</text>
  </g>
  <path d="M70 142 H1730" stroke="#D7DFEA" stroke-width="1.5"/>

  <!-- Lane 01 -->
  <g filter="url(#shadow)"><rect x="70" y="205" width="320" height="620" rx="22" class="lane"/></g>
  <g transform="translate(98 238)">
    <text class="mono blue" font-size="12" letter-spacing="1.5">01 · AUTHENTICATED INTAKE</text>
    <text y="35" class="display ink" font-size="25">Open one mission</text>
  </g>
  <g transform="translate(98 324)">
    <rect width="264" height="126" rx="14" class="nodeGreen"/>
    <g transform="translate(20 20)" color="#17815D"><path class="iconStroke" d="M3 12h22M18 5l7 7-7 7"/></g>
    <text x="58" y="28" class="mono green" font-size="10">NATIVE · EVENT ID + TRACE</text>
    <text x="20" y="64" class="display ink" font-size="20">Pub/Sub → Eventarc</text>
    <text x="20" y="91" class="body muted" font-size="14">Authenticated CloudEvent →</text>
    <text x="20" y="111" class="body muted" font-size="14">private Cloud Run controller.</text>
  </g>
  <g transform="translate(98 474)">
    <rect width="264" height="168" rx="14" class="nodeBlue"/>
    <text x="20" y="29" class="mono blue" font-size="10">CLOUD RUN WEB · DIGEST-BOUND</text>
    <text x="20" y="63" class="display ink" font-size="20">Evidence pair</text>
    <g transform="translate(20 83)">
      <rect width="105" height="58" rx="10" fill="#FFFFFF" stroke="#B9CAE6"/>
      <path d="M17 15h16v22H17zM21 20h8M21 25h8M21 30h5" fill="none" stroke="#326BDB" stroke-width="1.8"/>
      <text x="43" y="25" class="display ink" font-size="13">Scan</text>
      <text x="43" y="43" class="mono green" font-size="9">VALID</text>
    </g>
    <g transform="translate(139 83)">
      <rect width="105" height="58" rx="10" fill="#FFFFFF" stroke="#E5BEC1"/>
      <path d="M16 18h18v14H16zM16 18l9 8 9-8" fill="none" stroke="#C94D57" stroke-width="1.8"/>
      <text x="43" y="25" class="display ink" font-size="13">Email</text>
      <text x="43" y="43" class="mono coral" font-size="9">HOSTILE</text>
    </g>
  </g>
  <g transform="translate(98 676)">
    <rect width="264" height="96" rx="14" class="nodeCoral"/>
    <text x="20" y="27" class="mono coral" font-size="10">EXCEPTION · FAIL CLOSED</text>
    <text x="20" y="56" class="display ink" font-size="18">Quarantine</text>
    <text x="20" y="78" class="body muted" font-size="13">Zero fact · memory · transition</text>
  </g>
  <path d="M289 616 C340 642 332 688 294 706" class="exceptionEdge"/>

  <!-- Lane 02 -->
  <g filter="url(#shadow)"><rect x="450" y="205" width="420" height="620" rx="22" class="lane"/></g>
  <g transform="translate(478 238)">
    <text class="mono blue" font-size="12" letter-spacing="1.5">02 · GEMINI + ADK FLEET</text>
    <text y="35" class="display ink" font-size="25">Inspect and propose</text>
  </g>
  <g transform="translate(478 324)">
    <rect width="364" height="112" rx="14" class="nodeBlue"/>
    <text x="20" y="27" class="mono blue" font-size="10">VERTEX AI AGENT RUNTIME · GEMINI 3.5 FLASH</text>
    <text x="20" y="59" class="display ink" font-size="21">Mission Coordinator</text>
    <text x="20" y="84" class="body muted" font-size="14">Four transfers · one bounded resume tool</text>
    <rect x="270" y="19" width="74" height="26" rx="13" fill="#FFF1D5" stroke="#E4B96D"/>
    <text x="307" y="36" text-anchor="middle" class="mono amber" font-size="9">POST ×1</text>
  </g>
  <g transform="translate(478 460)">
    <rect width="364" height="102" rx="14" class="node"/>
    <text x="20" y="27" class="mono blue" font-size="10">FIXTURE LIVE · VERTEX AI ADAPTER STAGED</text>
    <text x="20" y="57" class="display ink" font-size="19">Gemini extraction</text>
    <text x="20" y="81" class="body muted" font-size="14">Typed schema → deterministic validation</text>
  </g>
  <g transform="translate(478 586)">
    <g><rect width="174" height="72" rx="12" class="node"/><text x="15" y="25" class="mono blue" font-size="9">READ ONLY</text><text x="15" y="50" class="display ink" font-size="16">Evidence worker</text></g>
    <g transform="translate(190)"><rect width="174" height="72" rx="12" class="node"/><text x="15" y="25" class="mono blue" font-size="9">READ ONLY</text><text x="15" y="50" class="display ink" font-size="16">Security worker</text></g>
    <g transform="translate(0 88)"><rect width="174" height="72" rx="12" class="node"/><text x="15" y="25" class="mono blue" font-size="9">READ ONLY</text><text x="15" y="50" class="display ink" font-size="16">Authority worker</text></g>
    <g transform="translate(190 88)"><rect width="174" height="72" rx="12" class="node"/><text x="15" y="25" class="mono blue" font-size="9">READ ONLY</text><text x="15" y="50" class="display ink" font-size="16">Recovery worker</text></g>
  </g>
  <text x="660" y="786" text-anchor="middle" class="mono green" font-size="11">ALL OUTPUT · release_authority=false</text>

  <!-- Lane 03 -->
  <g filter="url(#shadow)"><rect x="930" y="205" width="430" height="620" rx="22" class="lane"/></g>
  <g transform="translate(958 238)">
    <text class="mono amber" font-size="12" letter-spacing="1.5">03 · DETERMINISTIC AUTHORITY</text>
    <text y="35" class="display ink" font-size="25">Require two keys</text>
  </g>
  <g transform="translate(958 324)">
    <rect width="374" height="128" rx="14" class="nodeAmber"/>
    <text x="20" y="28" class="mono amber" font-size="10">PRIVATE CLOUD RUN · SOLE WRITER</text>
    <text x="20" y="63" class="display ink" font-size="22">Receipt saga controller</text>
    <text x="20" y="89" class="body muted" font-size="14">Prior state + version + validated evidence</text>
    <text x="20" y="110" class="body muted" font-size="14">+ signed receipt decide every transition.</text>
  </g>
  <g transform="translate(958 478)">
    <rect width="178" height="112" rx="14" class="nodeGreen"/>
    <text x="17" y="27" class="mono green" font-size="9">POSTGRESQL 16</text>
    <text x="17" y="57" class="display ink" font-size="19">Cloud SQL</text>
    <text x="17" y="81" class="body muted" font-size="13">Versions · leases</text>
    <text x="17" y="99" class="body muted" font-size="13">receipts · hashes</text>
  </g>
  <g transform="translate(1154 478)">
    <rect width="178" height="112" rx="14" class="nodeAmber"/>
    <text x="17" y="27" class="mono amber" font-size="9">KEY 1 · HUMAN</text>
    <text x="17" y="57" class="display ink" font-size="19">Attestation</text>
    <text x="17" y="81" class="body muted" font-size="13">One explicit owner</text>
    <text x="17" y="99" class="body muted" font-size="13">bond approval</text>
  </g>
  <g transform="translate(958 616)">
    <rect width="374" height="118" rx="14" class="nodeGreen"/>
    <text x="20" y="27" class="mono green" font-size="9">KEY 2 · 3 PRIVATE CLOUD RUN SERVICES</text>
    <text x="20" y="58" class="display ink" font-size="19">Insurer · Adjuster · Carrier</text>
    <text x="20" y="83" class="body muted" font-size="13">Guarantee · reject → accept · order + read-back</text>
    <text x="20" y="103" class="body muted" font-size="13">Identity-bound and replay-safe</text>
  </g>
  <path d="M958 675 C912 675 912 438 958 438" class="exceptionEdge"/>
  <rect x="985" y="750" width="255" height="30" rx="15" fill="#FFF2F3"/>
  <text x="1112" y="770" text-anchor="middle" class="mono coral" font-size="10">v1 REJECTED → CORRECTED v2</text>

  <!-- Lane 04 -->
  <g filter="url(#shadow)"><rect x="1420" y="205" width="310" height="620" rx="22" class="lane"/></g>
  <g transform="translate(1448 238)">
    <text class="mono green" font-size="12" letter-spacing="1.5">04 · CONSEQUENCE</text>
    <text y="35" class="display ink" font-size="25">Release, then notify</text>
  </g>
  <g transform="translate(1460 346)">
    <rect width="230" height="200" rx="20" fill="#EEF4FF" stroke="#AFC3E8" stroke-width="1.5"/>
    <path d="M30 76h170v90H30z" fill="#326BDB" stroke="#214EAE" stroke-width="5"/>
    <path d="M51 76v90M78 76v90M105 76v90M132 76v90M159 76v90M186 76v90" stroke="#75A0F0" stroke-width="2"/>
    <path d="M115 76v90" stroke="#173B86" stroke-width="5"/>
    <circle cx="91" cy="120" r="17" fill="#17815D" stroke="#fff" stroke-width="4"/>
    <circle cx="139" cy="120" r="17" fill="#17815D" stroke="#fff" stroke-width="4"/>
    <path d="M84 120l5 5 10-11M132 120l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="35" text-anchor="middle" class="mono green" font-size="10">TWO VERIFIED KEYS</text>
    <text x="115" y="188" text-anchor="middle" class="mono muted" font-size="10">PHYSICAL RELEASE BAY</text>
  </g>
  <g transform="translate(1460 574)">
    <rect width="230" height="76" rx="16" fill="#17815D"/>
    <text x="115" y="31" text-anchor="middle" class="mono" fill="#DDF6EC" font-size="10">CARGO STATE</text>
    <text x="115" y="58" text-anchor="middle" class="display" fill="#FFFFFF" font-size="27">RELEASED</text>
  </g>
  <g transform="translate(1460 678)">
    <rect width="230" height="102" rx="14" class="node"/>
    <text x="16" y="27" class="mono blue" font-size="9">SECRET MANAGER → SLACK</text>
    <text x="16" y="54" class="display ink" font-size="17">Marked Slack notice</text>
    <text x="16" y="76" class="body muted" font-size="12">Veo → private Cloud Storage</text>
    <text x="16" y="93" class="body muted" font-size="12">Adjustment remains OPEN</text>
  </g>

  <!-- Main flow -->
  <path d="M390 390 H438" class="advanceEdge"/>
  <path d="M390 548 H438" class="readEdge"/>
  <path d="M870 388 H918" class="advanceEdge"/>
  <path d="M1332 675 C1382 675 1408 612 1460 612" class="authorityEdge"/>

  <!-- Trust plane -->
  <g filter="url(#shadow)"><rect x="70" y="875" width="1660" height="178" rx="22" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="1.5"/></g>
  <g transform="translate(100 908)">
    <text class="mono blue" font-size="11" letter-spacing="1.5">CROSS-CUTTING TRUST PLANE</text>
    <text y="31" class="display ink" font-size="21">Identity and evidence around every transition</text>
  </g>
  <g transform="translate(560 906)" class="mono" font-size="11">
    <g><rect width="128" height="42" rx="21" fill="#F1F6FF" stroke="#B9CAE6"/><text x="64" y="26" text-anchor="middle" class="blue">AGENT IDENTITY</text></g>
    <g transform="translate(142)"><rect width="128" height="42" rx="21" fill="#F1F6FF" stroke="#B9CAE6"/><text x="64" y="26" text-anchor="middle" class="blue">AGENT GATEWAY</text></g>
    <g transform="translate(284)"><rect width="142" height="42" rx="21" fill="#F1F6FF" stroke="#B9CAE6"/><text x="71" y="26" text-anchor="middle" class="blue">MODEL ARMOR</text></g>
    <g transform="translate(440)"><rect width="128" height="42" rx="21" fill="#F1F6FF" stroke="#B9CAE6"/><text x="64" y="26" text-anchor="middle" class="blue">AGENT REGISTRY</text></g>
    <g transform="translate(582)"><rect width="146" height="42" rx="21" fill="#F1F6FF" stroke="#B9CAE6"/><text x="73" y="26" text-anchor="middle" class="blue">MEMORY BANK</text></g>
    <g transform="translate(742)"><rect width="150" height="42" rx="21" fill="#F1F6FF" stroke="#B9CAE6"/><text x="75" y="26" text-anchor="middle" class="blue">LOGGING + TRACE</text></g>
  </g>
  <g transform="translate(560 972)" class="mono" font-size="10">
    <path d="M0 15h65" class="readEdge"/><text x="82" y="19" class="muted">READ-ONLY INSPECTION</text>
    <path d="M296 15h65" class="advanceEdge"/><text x="378" y="19" class="muted">BOUNDED ACTION / HUMAN RESUME</text>
    <path d="M734 15h65" class="authorityEdge"/><text x="816" y="19" class="muted">VERIFIED RECEIPT</text>
  </g>

  <!-- Footer -->
  <g transform="translate(70 1105)">
    <rect width="1660" height="46" rx="12" fill="#17243A"/>
    <text x="24" y="29" class="mono" fill="#FFFFFF" font-size="12">INVARIANT · MODEL OUTPUT, MEMORY, AND WORKERS NEVER WRITE RELEASE STATE</text>
    <text x="1636" y="29" text-anchor="end" class="mono" fill="#AFC6F6" font-size="11">Cloud Run · Cloud SQL · Pub/Sub · Eventarc · Vertex AI</text>
  </g>
</svg>
