<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic adjuster security pack rejection</title>
  <desc id="desc">A fictional scanned adjuster form with a rejected stamp and a checked box showing the declaration reference is missing.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="19" result="noise"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.035" numOctaves="2" seed="7" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="#d8d5ca"/>
  <g transform="rotate(-0.45 600 750)">
    <rect x="82" y="58" width="1036" height="1384" rx="8" fill="#f4f0e4" stroke="#6c706f" stroke-width="3" filter="url(#paper)"/>
    <text x="140" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#23313b">NORTHSTAR MARINE ADJUSTMENT OFFICE</text>
    <text x="140" y="188" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17242d">SECURITY PACK REVIEW</text>
    <text x="140" y="230" font-family="Courier New, monospace" font-size="21" fill="#46545c">FICTIONAL DEMONSTRATION DOCUMENT · NOT LEGAL ADVICE</text>
    <line x1="140" y1="268" x2="1060" y2="268" stroke="#536169" stroke-width="3"/>

    <text x="140" y="330" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#35434a">CASE</text>
    <text x="350" y="330" font-family="Courier New, monospace" font-size="24" fill="#17242d">GA/NST/0819</text>
    <text x="140" y="382" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#35434a">CONTAINER</text>
    <text x="350" y="382" font-family="Courier New, monospace" font-size="24" fill="#17242d">TCLU-482019-7</text>
    <text x="140" y="434" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#35434a">PACK REVISION</text>
    <text x="350" y="434" font-family="Courier New, monospace" font-size="24" fill="#17242d">V1</text>

    <g transform="rotate(-7 865 390)" filter="url(#rough)">
      <rect x="760" y="315" width="245" height="126" rx="9" fill="none" stroke="#a92626" stroke-width="10"/>
      <text x="882" y="366" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" fill="#a92626">REJECTED</text>
      <text x="882" y="408" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#a92626">REVISION REQUIRED</text>
    </g>

    <rect x="140" y="500" width="920" height="530" fill="none" stroke="#788187" stroke-width="2"/>
    <rect x="140" y="500" width="920" height="58" fill="#dce1df"/>
    <text x="170" y="538" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17242d">REVIEW CHECKLIST</text>

    <rect x="174" y="602" width="34" height="34" fill="none" stroke="#29363e" stroke-width="3"/>
    <path d="M180 617l10 11 23-32" fill="none" stroke="#922a2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
    <text x="238" y="629" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17242d">Declaration reference missing</text>
    <text x="238" y="668" font-family="Arial, sans-serif" font-size="21" fill="#394951">Required field: declaration_reference</text>

    <rect x="174" y="725" width="34" height="34" fill="none" stroke="#29363e" stroke-width="3"/>
    <text x="238" y="752" font-family="Arial, sans-serif" font-size="25" fill="#35434a">Owner bond missing</text>
    <rect x="174" y="814" width="34" height="34" fill="none" stroke="#29363e" stroke-width="3"/>
    <text x="238" y="841" font-family="Arial, sans-serif" font-size="25" fill="#35434a">Insurer guarantee missing</text>
    <rect x="174" y="903" width="34" height="34" fill="none" stroke="#29363e" stroke-width="3"/>
    <text x="238" y="930" font-family="Arial, sans-serif" font-size="25" fill="#35434a">Container reference mismatch</text>

    <text x="140" y="1105" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#35434a">REVIEW NOTE</text>
    <line x1="140" y1="1130" x2="1060" y2="1130" stroke="#8b9192" stroke-width="2"/>
    <text x="158" y="1182" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="31" fill="#274b70" transform="rotate(-1 158 1182)">Add the declaration reference from the casualty notice,</text>
    <text x="158" y="1228" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="31" fill="#274b70" transform="rotate(-1 158 1228)">then resubmit as revision 2. — M. Hale</text>

    <line x1="140" y1="1300" x2="1060" y2="1300" stroke="#536169" stroke-width="2"/>
    <text x="140" y="1342" font-family="Courier New, monospace" font-size="18" fill="#46545c">FORM SR-17 · SCAN 2026-08-19T14:22:08Z · PAGE 1/1</text>
    <text x="140" y="1382" font-family="Courier New, monospace" font-size="17" fill="#6b7478">Synthetic fixture prepared for Cargo Release. No real party or shipment.</text>
  </g>
</svg>
